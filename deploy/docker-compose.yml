# Продакшен на одном VPS (как Kassa): Caddy (TLS) → api; Postgres рядом. Запуск: cd deploy && docker compose up -d
# Секреты — в deploy/.env (не в git): POSTGRES_PASSWORD, JWT_SECRET, DOMAIN
name: dark
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dark
      POSTGRES_USER: dark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dark -d dark"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    image: ghcr.io/relix2294/dark-api:${TAG:-latest}
    build: { context: .., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/shared/db/migrate.js"]
    environment:
      DATABASE_URL: postgres://dark:${POSTGRES_PASSWORD}@db:5432/dark
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    image: ghcr.io/relix2294/dark-api:${TAG:-latest}
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://dark:${POSTGRES_PASSWORD}@db:5432/dark
      JWT_SECRET: ${JWT_SECRET:?set in deploy/.env}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-stub}
      DISPLAY_TZ: Asia/Dushanbe
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./www:/srv/www:ro
    depends_on: [api]
