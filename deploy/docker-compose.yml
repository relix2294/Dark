# Продакшен на одном VPS рядом с Kassa: Caddy → api; Postgres рядом. Запуск: cd deploy && docker compose up -d
# Секреты — в deploy/.env (не в git; при первом деплое workflow создаёт его сам): POSTGRES_PASSWORD, JWT_SECRET, SITE_ADDRESS.
# Порты наружу — HTTP_PORT/HTTPS_PORT: на сервере с Kassa и Marzban 80/443 могут быть заняты.
name: dark
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dark
      POSTGRES_USER: dark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dark -d dark"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    image: ghcr.io/relix2294/dark-api:${TAG:-latest}
    build: { context: .., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/shared/db/migrate.js"]
    environment:
      DATABASE_URL: postgres://dark:${POSTGRES_PASSWORD}@db:5432/dark
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    image: ghcr.io/relix2294/dark-api:${TAG:-latest}
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://dark:${POSTGRES_PASSWORD}@db:5432/dark
      JWT_SECRET: ${JWT_SECRET:?set in deploy/.env}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-stub}
      DISPLAY_TZ: Asia/Dushanbe
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # фото товаров: local — том ниже (отдаёт Caddy по /media), s3 — переменные S3_* в deploy/.env
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /data/uploads
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-/media}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-ru-central1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["${HTTP_PORT:-8090}:80", "${HTTPS_PORT:-8453}:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./www:/srv/www:ro
      - ./data/uploads:/srv/media:ro
    depends_on: [api]
